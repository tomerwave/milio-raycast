name: Bug report
description: Report a reproducible problem in Milio.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private thoughts, Raycast storage contents, or other sensitive data.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the command and the exact actions that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Raycast, and Milio versions.
    validations:
      required: true
